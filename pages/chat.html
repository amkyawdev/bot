<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - AmkyawDev AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
            color: #e5e5e5;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f0f0f;
            position: relative;
        }

        /* ===== CHAT HEADER ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: transparent;
            height: 48px;
        }

        /* Left Side - Status Text */
        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-text {
            font-size: 13px;
            font-weight: 400;
            color: #a3a3a3;
        }

        .status-dots {
            display: flex;
            gap: 3px;
        }

        .status-dots span {
            width: 4px;
            height: 4px;
            background: #10a37f;
            border-radius: 50%;
            animation: thinking 1.4s infinite;
        }

        .status-dots span:nth-child(2) { animation-delay: 0.2s; }
        .status-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinking {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* Right Side - Connection Status */
        .connection-status {
            display: flex;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 30px;
            background: rgba(255,255,255,0.03);
        }

        .status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .status-light.online {
            background: #10a37f;
            box-shadow: 0 0 8px #10a37f;
            animation: pulse 2s infinite;
        }

        .status-light.warning {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }

        .status-light.error {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .status-light.offline {
            background: #6b6b6b;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .status-text-small {
            color: #a3a3a3;
            font-size: 11px;
        }

        /* ===== MESSAGES AREA ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: messageIn 0.3s ease;
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            background: #2d2d2d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #10a37f;
        }

        .message-avatar i {
            font-size: 14px;
            color: white;
        }

        .message-content {
            background: #2d2d2d;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message.user .message-content {
            background: #10a37f;
            color: white;
        }

        .message-time {
            font-size: 10px;
            color: #6b6b6b;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        /* Voice Button in Message - Hamburger Style */
        .message-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .voice-mini-btn {
            background: transparent;
            border: none;
            color: #a3a3a3;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
        }

        .voice-mini-btn:hover {
            background: #3d3d3d;
            color: #10a37f;
            border-color: #10a37f;
        }

        .voice-mini-btn.playing {
            color: #10a37f;
            animation: pulse 1s infinite;
            border-color: #10a37f;
        }

        .voice-mini-btn i {
            font-size: 10px;
        }

        .voice-mini-btn span {
            font-size: 10px;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            background: #1a1a1a;
            border-top: 1px solid #2d2d2d;
            padding: 16px;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 24px;
            padding: 4px 4px 4px 16px;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #10a37f;
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.1);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e5e5e5;
            font-size: 14px;
            padding: 10px 0;
            resize: none;
            max-height: 100px;
            outline: none;
            font-family: inherit;
        }

        .input-wrapper textarea::placeholder {
            color: #6b6b6b;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Action Buttons */
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: transparent;
            border: none;
            color: #a3a3a3;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .action-btn:hover {
            background: #3d3d3d;
            color: #10a37f;
        }

        .action-btn input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Send Button */
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #10a37f;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .send-btn:hover {
            background: #0d8a6b;
            transform: scale(1.05);
        }

        .send-btn.recording {
            background: #ef4444;
            animation: recordingPulse 1.5s infinite;
        }

        @keyframes recordingPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .send-btn.mic-mode {
            background: #f59e0b;
        }

        .send-btn i {
            font-size: 16px;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #2d2d2d;
            color: #e5e5e5;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            white-space: nowrap;
            margin-bottom: 6px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            border: 1px solid #404040;
            pointer-events: none;
            z-index: 100;
        }

        .send-btn:hover .tooltip,
        .action-btn:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* Upload Preview */
        .upload-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #2d2d2d;
            border-radius: 30px;
            margin-top: 10px;
            border: 1px solid #404040;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-info {
            flex: 1;
            font-size: 12px;
            color: #a3a3a3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-info i {
            color: #10a37f;
            width: 16px;
        }

        .preview-remove {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-remove:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .typing-dots {
            background: #2d2d2d;
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #a3a3a3;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Footer */
        .chat-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding: 0 8px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-info {
            font-size: 11px;
            color: #6b6b6b;
        }

        .file-info i {
            color: #10a37f;
            margin-right: 4px;
            font-size: 10px;
        }

        .word-count {
            font-size: 11px;
            color: #6b6b6b;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #10a37f;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }

            .status-text {
                font-size: 12px;
            }

            .status-text-small {
                display: none;
            }

            .input-wrapper {
                padding: 4px 4px 4px 12px;
            }

            .action-btn {
                width: 32px;
                height: 32px;
            }

            .send-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <!-- Left Side - Status Text -->
            <div class="status-container">
                <span class="status-text" id="statusText">Ask something...</span>
                <span class="status-dots" id="statusDots" style="display: none;">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </div>

            <!-- Right Side - Connection Status -->
            <div class="connection-status">
                <div class="status-indicator" id="connectionIndicator">
                    <span class="status-light online" id="statusLight"></span>
                    <span class="status-text-small" id="connectionText">Connected</span>
                </div>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages-area" id="messagesArea">
            <!-- Messages will be loaded here -->
        </div>

        <!-- Upload Preview (Hidden by default) -->
        <div class="upload-preview" id="uploadPreview" style="display: none;">
            <div class="preview-info">
                <i class="fas fa-file" id="fileIcon"></i>
                <span id="fileName">filename.txt</span>
                <span id="fileSize">(0 KB)</span>
            </div>
            <button class="preview-remove" onclick="window.chat?.clearUpload()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    rows="1"
                ></textarea>
                
                <div class="input-actions">
                    <!-- Upload Button -->
                    <div class="action-btn">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="fileUpload" multiple>
                        <span class="tooltip">Attach file</span>
                    </div>

                    <!-- Send Button (Dual Function) -->
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane" id="sendIcon"></i>
                        <i class="fas fa-microphone" id="micIcon" style="display: none;"></i>
                        <span class="tooltip" id="buttonTooltip">Send message</span>
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="chat-footer">
                <div class="footer-left">
                    <span class="file-info" id="fileCount">
                        <i class="fas fa-paperclip"></i> No files
                    </span>
                </div>
                <span class="word-count" id="wordCount">0/2000</span>
            </div>
        </div>
    </div>

    <!-- API Script -->
    <script src="../js/api.js"></script>
    
    <!-- Main Chat Script -->
    <script>
        // ===== CHAT SYSTEM =====
        class ChatSystem {
            constructor() {
                console.log('ChatSystem initializing...');
                
                this.messages = [];
                this.currentStatus = 'idle';
                this.apiStatus = 'online';
                this.pressTimer = null;
                this.isMicMode = false;
                this.isRecording = false;
                this.isSpeaking = false;
                this.currentFile = null;
                this.messageId = 0;
                this.recognition = null;
                
                this.statusTexts = {
                    idle: 'Ask something...',
                    thinking: 'Thinking',
                    creating: 'Creating',
                    building: 'Building',
                    reading: 'Reading',
                    solving: 'Solving',
                    error: 'Error',
                    prohibited: 'Prohibited'
                };

                this.init();
            }

            init() {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => this.setup());
                } else {
                    this.setup();
                }
            }

            setup() {
                console.log('Setting up ChatSystem...');
                
                this.cacheElements();
                this.setupEventListeners();
                this.loadMessages();
                this.checkAPIStatus();
                this.startStatusAnimation();
                
                console.log('ChatSystem ready');
            }

            cacheElements() {
                this.elements = {
                    messagesArea: document.getElementById('messagesArea'),
                    messageInput: document.getElementById('messageInput'),
                    sendBtn: document.getElementById('sendBtn'),
                    fileUpload: document.getElementById('fileUpload'),
                    statusText: document.getElementById('statusText'),
                    statusDots: document.getElementById('statusDots'),
                    statusLight: document.getElementById('statusLight'),
                    connectionText: document.getElementById('connectionText'),
                    uploadPreview: document.getElementById('uploadPreview'),
                    fileName: document.getElementById('fileName'),
                    fileSize: document.getElementById('fileSize'),
                    fileIcon: document.getElementById('fileIcon'),
                    fileCount: document.getElementById('fileCount'),
                    wordCount: document.getElementById('wordCount'),
                    sendIcon: document.getElementById('sendIcon'),
                    micIcon: document.getElementById('micIcon'),
                    buttonTooltip: document.getElementById('buttonTooltip')
                };
            }

            setupEventListeners() {
                // Input events
                if (this.elements.messageInput) {
                    this.elements.messageInput.addEventListener('input', (e) => {
                        this.autoResize(e.target);
                        this.updateWordCount();
                    });

                    this.elements.messageInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            this.sendMessage();
                        }
                    });
                }

                // Send button events
                if (this.elements.sendBtn) {
                    // Mouse events
                    this.elements.sendBtn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        this.startPressTimer();
                    });

                    this.elements.sendBtn.addEventListener('mouseup', (e) => {
                        e.preventDefault();
                        this.clearPressTimer();
                        this.handleSendClick();
                    });

                    this.elements.sendBtn.addEventListener('mouseleave', () => {
                        this.clearPressTimer();
                    });

                    // Touch events
                    this.elements.sendBtn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.startPressTimer();
                    });

                    this.elements.sendBtn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.clearPressTimer();
                        this.handleSendClick();
                    });
                }

                // File upload
                if (this.elements.fileUpload) {
                    this.elements.fileUpload.addEventListener('change', (e) => this.handleUpload(e));
                }

                // Parent messages
                window.addEventListener('message', (e) => {
                    if (e.data.type === 'new-chat') {
                        this.newChat();
                    } else if (e.data.type === 'load-chat') {
                        this.loadChat(e.data.chatId);
                    }
                });

                // API status check
                setInterval(() => this.checkAPIStatus(), 30000);
            }

            // ===== API STATUS =====
            async checkAPIStatus() {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    const response = await fetch('https://my.amkai.workers.dev/api/health', {
                        signal: controller.signal,
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        if (data.success) {
                            this.updateAPIStatus('online', 'Connected');
                        } else {
                            this.updateAPIStatus('error', 'API Error');
                        }
                    } else {
                        this.updateAPIStatus('error', 'API Error');
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        this.updateAPIStatus('warning', 'Timeout');
                    } else {
                        this.updateAPIStatus('offline', 'Offline');
                    }
                }
            }

            updateAPIStatus(status, text) {
                this.apiStatus = status;
                
                if (this.elements.statusLight) {
                    this.elements.statusLight.className = `status-light ${status}`;
                }
                if (this.elements.connectionText) {
                    this.elements.connectionText.textContent = text;
                }
            }

            // ===== STATUS ANIMATION =====
            startStatusAnimation() {
                setInterval(() => {
                    if (this.currentStatus === 'idle' && this.elements.statusText) {
                        const idleTexts = [
                            'Ask something...',
                            'Type your question...',
                            'Need help?',
                            'How can I assist?',
                            'Say something...'
                        ];
                        const random = Math.floor(Math.random() * idleTexts.length);
                        this.elements.statusText.textContent = idleTexts[random];
                    }
                }, 4000);
            }

            setStatus(status) {
                this.currentStatus = status;
                
                if (!this.elements.statusText || !this.elements.statusDots) return;

                if (status === 'idle') {
                    this.elements.statusText.textContent = this.statusTexts.idle;
                    this.elements.statusDots.style.display = 'none';
                } else {
                    this.elements.statusText.textContent = this.statusTexts[status] || status;
                    this.elements.statusDots.style.display = 'flex';
                }
            }

            // ===== SEND BUTTON LOGIC =====
            startPressTimer() {
                this.pressTimer = setTimeout(() => {
                    this.toggleMicMode();
                }, 500);
            }

            clearPressTimer() {
                if (this.pressTimer) {
                    clearTimeout(this.pressTimer);
                    this.pressTimer = null;
                }
            }

            toggleMicMode() {
                this.isMicMode = !this.isMicMode;
                
                if (this.elements.sendBtn) {
                    if (this.isMicMode) {
                        this.elements.sendBtn.classList.add('mic-mode');
                        if (this.elements.sendIcon) this.elements.sendIcon.style.display = 'none';
                        if (this.elements.micIcon) this.elements.micIcon.style.display = 'block';
                        if (this.elements.buttonTooltip) this.elements.buttonTooltip.textContent = 'Click to speak';
                    } else {
                        this.elements.sendBtn.classList.remove('mic-mode');
                        if (this.elements.sendIcon) this.elements.sendIcon.style.display = 'block';
                        if (this.elements.micIcon) this.elements.micIcon.style.display = 'none';
                        if (this.elements.buttonTooltip) this.elements.buttonTooltip.textContent = 'Send message';
                    }
                }
            }

            handleSendClick() {
                if (this.isMicMode) {
                    this.startVoiceRecording();
                } else {
                    this.sendMessage();
                }
            }

            // ===== VOICE RECORDING =====
            async startVoiceRecording() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert('Voice recognition is not supported in your browser.');
                    return;
                }

                try {
                    if (this.elements.sendBtn) {
                        this.elements.sendBtn.classList.add('recording');
                    }
                    
                    this.setStatus('reading');
                    this.isRecording = true;

                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    
                    this.recognition.continuous = false;
                    this.recognition.interimResults = true;
                    this.recognition.lang = 'en-US';

                    let finalTranscript = '';

                    this.recognition.onresult = (event) => {
                        let interimTranscript = '';
                        
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const transcript = event.results[i][0].transcript;
                            
                            if (event.results[i].isFinal) {
                                finalTranscript += transcript + ' ';
                            } else {
                                interimTranscript += transcript;
                            }
                        }
                        
                        if (this.elements.messageInput) {
                            this.elements.messageInput.value = finalTranscript || interimTranscript;
                            this.autoResize(this.elements.messageInput);
                        }
                    };

                    this.recognition.onend = () => {
                        if (this.elements.sendBtn) {
                            this.elements.sendBtn.classList.remove('recording');
                        }
                        this.isRecording = false;
                        this.setStatus('idle');
                        
                        if (finalTranscript.trim() && this.elements.messageInput) {
                            this.elements.messageInput.value = finalTranscript.trim();
                            this.sendMessage();
                        }
                    };

                    this.recognition.onerror = (error) => {
                        console.error('Recognition error:', error);
                        if (this.elements.sendBtn) {
                            this.elements.sendBtn.classList.remove('recording');
                        }
                        this.isRecording = false;
                        this.setStatus('idle');
                        
                        if (error.error === 'not-allowed') {
                            alert('Microphone access denied. Please allow microphone access.');
                        }
                    };

                    this.recognition.start();

                } catch (error) {
                    console.error('Voice recording error:', error);
                    if (this.elements.sendBtn) {
                        this.elements.sendBtn.classList.remove('recording');
                    }
                    this.isRecording = false;
                    this.setStatus('idle');
                }
            }

            // ===== TEXT TO SPEECH (ပြင်ဆင်ပြီး) =====
speakText(text, button) {
    console.log('Attempting to speak:', text.substring(0, 30));
    
    if (!('speechSynthesis' in window)) {
        console.error('Speech synthesis not supported');
        alert('Your browser does not support text-to-speech. Please use Chrome, Edge, or Safari.');
        return;
    }

    // Stop current speech
    if (this.isSpeaking) {
        window.speechSynthesis.cancel();
        this.isSpeaking = false;
        
        if (button) {
            button.classList.remove('playing');
            button.innerHTML = '<i class="fas fa-volume-up"></i><span>Listen</span>';
        }
        return;
    }

    // Create utterance
    const utterance = new SpeechSynthesisUtterance(text);
    
    // Get available voices
    const voices = window.speechSynthesis.getVoices();
    console.log('Available voices:', voices.length);
    
    // Find a good English voice
    let selectedVoice = null;
    
    // Try to find Google or Microsoft voices first
    selectedVoice = voices.find(v => 
        v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Microsoft'))
    );
    
    // If not found, try any English voice
    if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.includes('en'));
    }
    
    // If still not found, use first available
    if (!selectedVoice && voices.length > 0) {
        selectedVoice = voices[0];
    }
    
    if (selectedVoice) {
        utterance.voice = selectedVoice;
        console.log('Selected voice:', selectedVoice.name);
    } else {
        console.log('No voice selected, using default');
    }

    // Set properties
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    utterance.lang = 'en-US';

    // Events
    utterance.onstart = () => {
        console.log('Speech started');
        this.isSpeaking = true;
        if (button) {
            button.classList.add('playing');
            button.innerHTML = '<i class="fas fa-stop"></i><span>Stop</span>';
        }
    };

    utterance.onend = () => {
        console.log('Speech ended');
        this.isSpeaking = false;
        if (button) {
            button.classList.remove('playing');
            button.innerHTML = '<i class="fas fa-volume-up"></i><span>Listen</span>';
        }
    };

    utterance.onerror = (event) => {
        console.error('Speech error:', event.error);
        this.isSpeaking = false;
        if (button) {
            button.classList.remove('playing');
            button.innerHTML = '<i class="fas fa-volume-up"></i><span>Listen</span>';
        }
        
        // Show user-friendly error
        if (event.error === 'not-allowed') {
            alert('Speech synthesis was blocked. Please check your browser settings.');
        } else if (event.error === 'interrupted') {
            // Normal interruption, ignore
        } else {
            alert('Failed to play speech: ' + event.error);
        }
    };

    // Speak
    try {
        window.speechSynthesis.speak(utterance);
    } catch (error) {
        console.error('Failed to speak:', error);
        alert('Failed to start speech synthesis: ' + error.message);
    }
}

// ===== TEST FUNCTION (အသံစမ်းဖို့) =====
testVoice() {
    console.log('Testing voice...');
    const testText = 'Hello, this is a test of the voice system.';
    this.speakText(testText, null);
}

            // ===== MESSAGE HANDLING =====
            async sendMessage() {
                if (!this.elements.messageInput) return;

                const message = this.elements.messageInput.value.trim();
                
                if (!message && !this.currentFile) return;

                this.analyzeMessageIntent(message);

                this.addMessage('user', message || '[File uploaded]', this.currentFile);
                
                this.elements.messageInput.value = '';
                this.autoResize(this.elements.messageInput);
                this.updateWordCount();
                this.showTyping();

                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));

                    let response;
                    if (this.apiStatus === 'online' && window.api) {
                        try {
                            const result = await window.api.chat(message);
                            response = result.data?.response || result.response || this.getOfflineResponse(message);
                        } catch {
                            response = this.getOfflineResponse(message);
                        }
                    } else {
                        response = this.getOfflineResponse(message);
                    }

                    this.hideTyping();
                    this.addMessage('assistant', response);
                    this.setStatus('idle');

                    if (this.isMicMode && !this.isRecording) {
                        setTimeout(() => {
                            const lastMessage = document.querySelector('.message.assistant:last-child .voice-mini-btn');
                            if (lastMessage) {
                                this.playMessage(lastMessage);
                            }
                        }, 500);
                    }

                } catch (error) {
                    console.error('Send error:', error);
                    this.hideTyping();
                    this.addMessage('system', 'Error: Failed to get response.');
                    this.setStatus('error');
                } finally {
                    this.clearUpload();
                }
            }

            analyzeMessageIntent(message) {
                const lower = message.toLowerCase();
                
                if (lower.includes('think')) {
                    this.setStatus('thinking');
                } else if (lower.includes('create') || lower.includes('make')) {
                    this.setStatus('creating');
                } else if (lower.includes('build')) {
                    this.setStatus('building');
                } else if (lower.includes('read')) {
                    this.setStatus('reading');
                } else if (lower.includes('solve')) {
                    this.setStatus('solving');
                } else if (lower.includes('bad') || lower.includes('inappropriate')) {
                    this.setStatus('prohibited');
                } else {
                    this.setStatus('thinking');
                }
            }

            getOfflineResponse(message) {
                const lower = message.toLowerCase();
                
                if (lower.includes('hello') || lower.includes('hi')) {
                    return "Hello! How are you today?";
                } else if (lower.includes('help')) {
                    return "I'd be happy to help! What do you need?";
                } else if (lower.includes('thank')) {
                    return "You're welcome!";
                } else if (lower.includes('bye')) {
                    return "Goodbye! Come back soon.";
                }
                
                const responses = [
                    "I understand. How can I help?",
                    "Thanks for your message!",
                    "Interesting! Tell me more.",
                    "Got it. What else?",
                    "I'm here to assist you."
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            // ===== MESSAGE RENDERING =====
            addMessage(role, content, file = null) {
                if (!this.elements.messagesArea) return;

                this.messageId++;
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                messageDiv.id = `msg-${this.messageId}`;

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                let fileHtml = '';
                if (file) {
                    fileHtml = `<div style="margin-top: 8px; padding: 6px; background: rgba(255,255,255,0.1); border-radius: 6px; font-size: 11px;">
                        <i class="fas fa-paperclip"></i> ${file.name} (${(file.size / 1024).toFixed(1)} KB)
                    </div>`;
                }

                let actionsHtml = '';
                if (role === 'assistant' || role === 'user') {
                    actionsHtml = `
                        <div class="message-actions">
                            <button class="voice-mini-btn" onclick="window.chat?.playMessage(this)">
                                <i class="fas fa-volume-up"></i>
                                <span>Listen</span>
                            </button>
                        </div>
                    `;
                }

                messageDiv.innerHTML = `
                    <div class="message-avatar">
                        <i class="fas ${role === 'user' ? 'fa-user' : role === 'system' ? 'fa-exclamation-triangle' : 'fa-robot'}"></i>
                    </div>
                    <div class="message-content">
                        ${this.escapeHtml(content)}
                        ${fileHtml}
                        ${actionsHtml}
                    </div>
                    <div class="message-time">${time}</div>
                `;

                this.elements.messagesArea.appendChild(messageDiv);
                this.elements.messagesArea.scrollTop = this.elements.messagesArea.scrollHeight;
                
                this.saveMessages();
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            showTyping() {
                if (!this.elements.messagesArea) return;

                this.hideTyping();

                const typing = document.createElement('div');
                typing.className = 'typing-indicator';
                typing.id = 'typingIndicator';
                typing.innerHTML = `
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;
                
                this.elements.messagesArea.appendChild(typing);
                this.elements.messagesArea.scrollTop = this.elements.messagesArea.scrollHeight;
            }

            hideTyping() {
                const typing = document.getElementById('typingIndicator');
                if (typing) typing.remove();
            }

            // ===== UI HELPERS =====
            autoResize(textarea) {
                if (!textarea) return;
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
            }

            updateWordCount() {
                if (this.elements.messageInput && this.elements.wordCount) {
                    this.elements.wordCount.textContent = `${this.elements.messageInput.value.length}/2000`;
                }
            }

            // ===== MESSAGE STORAGE =====
            saveMessages() {
                try {
                    const messages = [];
                    document.querySelectorAll('.message').forEach(msg => {
                        const role = msg.classList.contains('user') ? 'user' : 
                                    msg.classList.contains('system') ? 'system' : 'assistant';
                        const contentDiv = msg.querySelector('.message-content');
                        const content = contentDiv?.childNodes[0]?.textContent || contentDiv?.textContent || '';
                        messages.push({ role, content });
                    });
                    
                    localStorage.setItem('chatMessages', JSON.stringify(messages));
                } catch (e) {
                    console.error('Failed to save messages:', e);
                }
            }

            loadMessages() {
                try {
                    const saved = localStorage.getItem('chatMessages');
                    if (saved) {
                        const messages = JSON.parse(saved);
                        if (this.elements.messagesArea) {
                            this.elements.messagesArea.innerHTML = '';
                            messages.forEach(msg => {
                                this.addMessage(msg.role, msg.content);
                            });
                        }
                    } else {
                        this.addMessage('assistant', 'Hello! How can I help you today?');
                    }
                } catch (e) {
                    console.error('Failed to load messages:', e);
                    this.addMessage('assistant', 'Hello! How can I help you today?');
                }
            }

            // ===== CHAT MANAGEMENT =====
            newChat() {
                if (this.elements.messagesArea) {
                    this.elements.messagesArea.innerHTML = '';
                    this.addMessage('assistant', 'Hello! How can I help you today?');
                }
                
                localStorage.removeItem('chatMessages');
                this.setStatus('idle');
                this.clearUpload();
                
                if (window.parent) {
                    window.parent.postMessage({ type: 'chat-title-update', title: 'New Chat' }, '*');
                }
            }

            loadChat(chatId) {
                console.log('Loading chat:', chatId);
            }

            // Cleanup
            destroy() {
                if (this.isSpeaking) {
                    window.speechSynthesis.cancel();
                }
                if (this.recognition && this.isRecording) {
                    this.recognition.stop();
                }
            }
        }

        // Initialize chat
        const chat = new ChatSystem();
        window.chat = chat;

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            if (chat) chat.destroy();
        });
    </script>
