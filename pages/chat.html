<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - AmkyawDev AI</title>
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a1a;
            color: #e5e5e5;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
            position: relative;
        }

        /* ===== CHAT HEADER ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #2d2d2d;
            background: transparent;
            height: 60px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-text {
            font-size: 13px;
            color: #a3a3a3;
        }

        .status-dots {
            display: flex;
            gap: 3px;
        }

        .status-dots span {
            width: 4px;
            height: 4px;
            background: #10a37f;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .status-dots span:nth-child(2) { animation-delay: 0.2s; }
        .status-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .connection-status {
            display: flex;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #2d2d2d;
        }

        .status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-light.online { background: #10a37f; box-shadow: 0 0 8px #10a37f; animation: pulse 2s infinite; }
        .status-light.offline { background: #6b6b6b; }
        .status-light.error { background: #ef4444; }
        .status-light.warning { background: #f59e0b; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .status-text-small {
            font-size: 11px;
            color: #a3a3a3;
        }

        /* ===== MESSAGES AREA ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            background: #2d2d2d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #10a37f;
        }

        .message-avatar i {
            font-size: 14px;
            color: white;
        }

        .message-content {
            background: #2d2d2d;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message.user .message-content {
            background: #10a37f;
            color: white;
        }

        .message.system .message-content {
            background: #3d3d3d;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .message-time {
            font-size: 10px;
            color: #6b6b6b;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        /* File Attachment in Message */
        .file-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 11px;
        }

        .file-attachment i {
            color: #10a37f;
        }

        /* Voice Button in Message */
        .message-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .voice-mini-btn {
            background: transparent;
            border: none;
            color: #a3a3a3;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            border: 1px solid #404040;
        }

        .voice-mini-btn:hover {
            background: #3d3d3d;
            color: #10a37f;
            border-color: #10a37f;
        }

        .voice-mini-btn.playing {
            color: #10a37f;
            animation: pulse 1s infinite;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .typing-dots {
            background: #2d2d2d;
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #a3a3a3;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            background: #2d2d2d;
            border-top: 1px solid #404040;
            padding: 20px;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 24px;
            padding: 4px 4px 4px 16px;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #10a37f;
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.2);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e5e5e5;
            font-size: 14px;
            padding: 10px 0;
            resize: none;
            max-height: 100px;
            outline: none;
            font-family: inherit;
        }

        .input-wrapper textarea::placeholder {
            color: #6b6b6b;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Action Buttons */
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: transparent;
            border: none;
            color: #a3a3a3;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .action-btn:hover {
            background: #3d3d3d;
            color: #10a37f;
        }

        .action-btn input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Send/Mic Button */
        .send-mic-btn {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #10a37f;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .send-mic-btn:hover {
            background: #0d8a6b;
            transform: scale(1.05);
        }

        .send-mic-btn.recording {
            background: #ef4444;
            animation: recordingPulse 1.5s infinite;
        }

        @keyframes recordingPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .send-mic-btn.mic-mode {
            background: #f59e0b;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #2d2d2d;
            color: #e5e5e5;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            white-space: nowrap;
            margin-bottom: 6px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            border: 1px solid #404040;
            pointer-events: none;
            z-index: 100;
        }

        .send-mic-btn:hover .tooltip,
        .action-btn:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* Upload Preview */
        .upload-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #2d2d2d;
            border-radius: 30px;
            margin-top: 10px;
            border: 1px solid #404040;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-info {
            flex: 1;
            font-size: 12px;
            color: #a3a3a3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-info i {
            color: #10a37f;
            width: 16px;
        }

        .preview-remove {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-remove:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Footer */
        .chat-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 8px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-info {
            font-size: 11px;
            color: #6b6b6b;
        }

        .file-info i {
            color: #10a37f;
            margin-right: 4px;
            font-size: 10px;
        }

        .word-count {
            font-size: 11px;
            color: #6b6b6b;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #10a37f;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }

            .status-text {
                font-size: 12px;
            }

            .status-text-small {
                display: none;
            }

            .input-wrapper {
                padding: 4px 4px 4px 12px;
            }

            .action-btn {
                width: 32px;
                height: 32px;
            }

            .send-mic-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="status-container">
                <span class="status-text" id="statusText">Ask something...</span>
                <span class="status-dots" id="statusDots" style="display: none;">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </div>

            <div class="connection-status">
                <div class="status-indicator">
                    <span class="status-light" id="statusLight"></span>
                    <span class="status-text-small" id="connectionText">Checking...</span>
                </div>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages-area" id="messagesArea"></div>

        <!-- Upload Preview (Hidden by default) -->
        <div class="upload-preview" id="uploadPreview" style="display: none;">
            <div class="preview-info">
                <i class="fas fa-file" id="fileIcon"></i>
                <span id="fileName">filename.txt</span>
                <span id="fileSize">(0 KB)</span>
            </div>
            <button class="preview-remove" onclick="window.chat?.clearUpload()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Type a message or click mic to speak..." 
                    rows="1"
                ></textarea>
                
                <div class="input-actions">
                    <!-- Upload Button -->
                    <div class="action-btn" id="uploadBtn">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="fileUpload" multiple accept="image/*,.pdf,.doc,.docx,.txt">
                        <span class="tooltip">Attach file</span>
                    </div>

                    <!-- Send/Mic Button (Dual Function) -->
                    <button class="send-mic-btn" id="sendBtn">
                        <i class="fas fa-paper-plane" id="sendIcon"></i>
                        <i class="fas fa-microphone" id="micIcon" style="display: none;"></i>
                        <span class="tooltip" id="buttonTooltip">Send message</span>
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="chat-footer">
                <div class="footer-left">
                    <span class="file-info" id="fileCount">
                        <i class="fas fa-paperclip"></i> No files
                    </span>
                </div>
                <span class="word-count" id="wordCount">0/2000</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../worker/api.js"></script>
    <script src="../js/chat.js"></script>
</body>
</html>
