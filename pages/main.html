<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>AmkyawDev AI - Main</title>
    <link rel="stylesheet" href="../css/bulma.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a1a;
            color: #e5e5e5;
            overflow: hidden;
            height: 100vh;
        }
        
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3d3d3d;
            --bg-menu: #262626;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #6b6b6b;
            --accent: #10a37f;
            --accent-dark: #0d8a6b;
            --border: #404040;
            --glass-bg: rgba(38, 38, 38, 0.95);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
        }
        
        #three-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #10a37f 0%, transparent 70%);
        }
        
        .app {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        
        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(45, 45, 45, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 56px;
        }
        
        .hamburger-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .hamburger-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .hamburger-btn:hover {
            background: var(--bg-tertiary);
        }
        
        .hamburger-btn span {
            width: 18px;
            height: 2px;
            background: var(--text-secondary);
            border-radius: 2px;
            transition: all 0.3s;
        }
        
        .hamburger-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
            background: var(--accent);
        }
        
        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
            background: var(--accent);
        }
        
        .logo-mini {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-mini i {
            font-size: 16px;
            color: white;
        }
        
        .chat-title-container {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        
        .current-chat-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--bg-tertiary);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid var(--border);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .current-chat-title i {
            color: var(--accent);
            margin-right: 6px;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
        }
        
        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent);
        }
        
        .settings-ellipsis-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
        }
        
        .settings-ellipsis-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent);
        }
        
        .model-badge {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        
        /* Left Menu */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .left-menu {
            position: fixed;
            left: -260px;
            top: 0;
            bottom: 0;
            width: 240px;
            background: linear-gradient(135deg, #262626 0%, #2d2d2d 100%);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3);
        }
        
        .left-menu.open {
            left: 0;
        }
        
        .menu-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .menu-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .menu-avatar {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        
        .menu-user-info h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        
        .menu-user-info p {
            font-size: 10px;
            color: var(--text-muted);
        }
        
        .menu-items {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        .menu-section {
            margin-bottom: 16px;
        }
        
        .menu-section-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 8px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        
        .menu-item i {
            width: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        
        .menu-item.active {
            background: rgba(16, 163, 127, 0.1);
            color: var(--accent);
        }
        
        .menu-item.active i {
            color: var(--accent);
        }
        
        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 12px 0;
        }
        
        .chat-history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
            position: relative;
        }
        
        .chat-history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        
        .chat-history-item i {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .chat-history-item span {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-history-item .delete-chat {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
        }
        
        .chat-history-item:hover .delete-chat {
            opacity: 1;
        }
        
        .chat-history-item .delete-chat:hover {
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .clear-all-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--danger);
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
            border: 1px dashed var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }
        
        .clear-all-btn i {
            width: 16px;
            font-size: 12px;
            color: var(--danger);
        }
        
        .clear-all-btn:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
        
        @media (max-width: 768px) {
            .current-chat-title {
                font-size: 14px;
                padding: 6px 12px;
                max-width: 180px;
            }
            
            .model-badge {
                display: none;
            }
            
            .left-menu {
                width: 220px;
            }
            
            .chat-history-item .delete-chat {
                opacity: 1;
            }
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="three-bg"></div>
    
    <div class="app" x-data="mainApp()" x-init="init()">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="hamburger-group">
                <button class="hamburger-btn" :class="{ 'active': leftMenuOpen }" @click="toggleLeftMenu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                
                <div class="logo-mini">
                    <i class="fas fa-robot"></i>
                </div>
            </div>
            
            <div class="chat-title-container">
                <div class="current-chat-title">
                    <i class="fas fa-comment"></i>
                    <span x-text="currentChatTitle">New Chat</span>
                </div>
            </div>
            
            <div class="header-actions">
                <span class="model-badge" x-text="selectedModel">GPT-4</span>
                <button class="settings-ellipsis-btn" @click="goToSettings" title="Settings">
                    <i class="fas fa-ellipsis-vertical"></i>
                </button>
            </div>
        </div>
        
        <!-- Left Menu Overlay -->
        <div class="menu-overlay" :class="{ 'active': leftMenuOpen }" @click="leftMenuOpen = false"></div>
        
        <!-- Left Menu -->
        <div class="left-menu" :class="{ 'open': leftMenuOpen }">
            <div class="menu-header">
                <div class="menu-user">
                    <div class="menu-avatar" x-text="user.initials || 'AK'"></div>
                    <div class="menu-user-info">
                        <h4 x-text="user.name">Aung Myo Kyaw</h4>
                        <p x-text="user.email">aung@example.com</p>
                    </div>
                </div>
            </div>
            
            <div class="menu-items">
                <!-- Main Actions -->
                <div class="menu-section">
                    <div class="menu-section-title">ACTIONS</div>
                    
                    <div class="menu-item" @click="newChat">
                        <i class="fas fa-plus-circle"></i>
                        <span>New Chat</span>
                    </div>
                    
                    <div class="menu-item" @click="navigateTo('docs.html', 'Docs')">
                        <i class="fas fa-book"></i>
                        <span>Documentation</span>
                    </div>
                    
                    <div class="menu-item" @click="navigateTo('project-about.html', 'About')">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                    </div>
                </div>
                
                <div class="menu-divider"></div>
                
                <!-- Chat History -->
                <div class="menu-section">
                    <div class="menu-section-title">RECENT CHATS</div>
                    
                    <div id="chat-history-list">
                        <template x-for="chat in chatHistory" :key="chat.id">
                            <div class="chat-history-item" @click="loadChat(chat.id)">
                                <i class="fas fa-comment"></i>
                                <span x-text="chat.title"></span>
                                <button class="delete-chat" @click.stop="deleteChat(chat.id)">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </template>
                        
                        <div class="chat-history-item" x-show="chatHistory.length === 0" style="opacity: 0.5;">
                            <i class="fas fa-search"></i>
                            <span>No chats yet</span>
                        </div>
                    </div>
                    
                    <div class="clear-all-btn" @click="clearAllChats">
                        <i class="fas fa-trash"></i>
                        <span>Clear All Chats</span>
                    </div>
                </div>
                
                <div class="menu-divider"></div>
                
                <div class="menu-section">
                    <div class="menu-item" @click="navigateTo('user-profile.html', 'Profile')">
                        <i class="fas fa-user-circle"></i>
                        <span>Profile</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content" @click="leftMenuOpen = false">
            <iframe class="content-frame" :src="currentPage" frameborder="0" id="main-frame"></iframe>
        </div>
    </div>
    
    <script src="../js/background-three.js"></script>
    <script>
        function mainApp() {
            return {
                leftMenuOpen: false,
                currentPage: 'chat.html',
                currentChatTitle: 'New Chat',
                selectedModel: localStorage.getItem('ai_model') || 'GPT-4',
                user: {
                    initials: 'AK',
                    name: localStorage.getItem('userName') || 'Aung Myo Kyaw',
                    email: localStorage.getItem('userEmail') || 'aung@example.com'
                },
                chatHistory: [],
                
                init() {
                    // Load user
                    const savedUser = localStorage.getItem('user');
                    if (savedUser) {
                        try {
                            const userData = JSON.parse(savedUser);
                            this.user = { ...this.user, ...userData };
                        } catch (e) {}
                    }
                    
                    // Load chat history
                    this.loadChatHistory();
                    
                    // Listen for messages from iframe
                    window.addEventListener('message', (e) => {
                        if (e.data.type === 'chat-title-update') {
                            this.currentChatTitle = e.data.title || 'Chat';
                        } else if (e.data.type === 'chat-history-update') {
                            this.loadChatHistory();
                        }
                    });
                    
                    // Keyboard shortcut
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            this.leftMenuOpen = false;
                        }
                    });
                },
                
                loadChatHistory() {
                    const saved = localStorage.getItem('chatHistory');
                    if (saved) {
                        try {
                            this.chatHistory = JSON.parse(saved);
                        } catch (e) {
                            this.chatHistory = [];
                        }
                    } else {
                        this.chatHistory = [];
                    }
                },
                
                toggleLeftMenu() {
                    this.leftMenuOpen = !this.leftMenuOpen;
                    if (this.leftMenuOpen) {
                        this.loadChatHistory();
                    }
                },
                
                navigateTo(page, title) {
                    this.currentPage = page;
                    if (page !== 'chat.html') {
                        this.currentChatTitle = title;
                    }
                    this.leftMenuOpen = false;
                },
                
                goToSettings() {
                    this.navigateTo('main-setting.html', 'Settings');
                },
                
                newChat() {
                    this.navigateTo('chat.html', 'New Chat');
                    this.currentChatTitle = 'New Chat';
                    
                    setTimeout(() => {
                        const frame = document.getElementById('main-frame');
                        if (frame && frame.contentWindow) {
                            frame.contentWindow.postMessage({ type: 'new-chat' }, '*');
                        }
                    }, 100);
                },
                
                loadChat(chatId) {
                    this.navigateTo('chat.html', 'Loading...');
                    
                    setTimeout(() => {
                        const frame = document.getElementById('main-frame');
                        if (frame && frame.contentWindow) {
                            frame.contentWindow.postMessage({ type: 'load-chat', chatId: chatId }, '*');
                        }
                    }, 100);
                },
                
                deleteChat(chatId) {
                    if (confirm('Delete this chat?')) {
                        this.chatHistory = this.chatHistory.filter(chat => chat.id !== chatId);
                        localStorage.setItem('chatHistory', JSON.stringify(this.chatHistory));
                    }
                },
                
                clearAllChats() {
                    if (confirm('Clear all chats? This cannot be undone.')) {
                        this.chatHistory = [];
                        localStorage.setItem('chatHistory', JSON.stringify(this.chatHistory));
                        this.newChat();
                    }
                }
            };
        }
    </script>
</body>
</html>
