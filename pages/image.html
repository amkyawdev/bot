<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Image Generator - AmkyawDev AI</title>
    <link rel="stylesheet" href="../css/bulma.css">
    <link rel="stylesheet" href="../css/image.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #2a2a35;
            --text-primary: #fff;
            --text-secondary: #a0a0b0;
            --accent: #19c37d;
            --border: #2a2a35;
        }
        
        [data-theme="chatgpt"] {
            --bg-primary: #343541;
            --bg-secondary: #40414f;
            --bg-tertiary: #444654;
            --text-primary: #ececf1;
            --accent: #19c37d;
            --border: #4d4d4f;
        }
        
        .image-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        
        /* Status Line */
        .status-line {
            height: 28px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 10px;
            color: var(--text-secondary);
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        /* Main Layout */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 16px;
            gap: 16px;
        }
        
        /* Input Panel */
        .input-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        
        .prompt-card, .options-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }
        
        .prompt-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        .prompt-header i {
            color: var(--accent);
        }
        
        .prompt-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }
        
        .prompt-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            min-height: 80px;
            outline: none;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        
        .option-item select {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
        }
        
        .generate-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        
        .generate-btn:disabled {
            opacity: 0.5;
        }
        
        /* Gallery Panel */
        .gallery-panel {
            width: 60%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .gallery-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        
        .gallery-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }
        
        .gallery-item {
            aspect-ratio: 1;
            background: var(--bg-tertiary);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .empty-gallery {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            position: relative;
        }
        
        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .modal-close {
            position: absolute;
            top: -30px;
            right: -30px;
            width: 30px;
            height: 30px;
            background: var(--accent);
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
        }
        
        /* Waiting */
        .waiting-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .waiting-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(25,195,125,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .input-panel, .gallery-panel { width: 100%; }
            .gallery-panel { height: 50%; }
        }
    </style>
</head>
<body>
    <div class="image-container" x-data="imageApp()" x-init="init()">
        <!-- Status Line -->
        <div class="status-line">
            <div class="status-left">
                <span>🎨 Image Generator</span>
            </div>
            <div class="status-right">
                <span>v2.0</span>
            </div>
        </div>
        
        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Input Panel -->
            <div class="input-panel">
                <div class="prompt-card">
                    <div class="prompt-header">
                        <i class="fas fa-pen-fancy"></i>
                        <span>Prompt</span>
                        <span style="margin-left: auto; font-size: 11px;" x-text="prompt.length + '/500'"></span>
                    </div>
                    <div class="prompt-box">
                        <textarea x-model="prompt" placeholder="Describe the image..." maxlength="500" rows="4"></textarea>
                    </div>
                </div>
                
                <div class="options-card">
                    <div class="prompt-header">
                        <i class="fas fa-sliders-h"></i>
                        <span>Settings</span>
                    </div>
                    
                    <div class="options-grid">
                        <div class="option-item">
                            <select x-model="style">
                                <option value="photorealistic">Photo</option>
                                <option value="digital-art">Digital</option>
                                <option value="anime">Anime</option>
                            </select>
                        </div>
                        <div class="option-item">
                            <select x-model="size">
                                <option value="512x512">512</option>
                                <option value="1024x1024">1024</option>
                            </select>
                        </div>
                        <div class="option-item">
                            <select x-model="quality">
                                <option value="standard">Std</option>
                                <option value="hd">HD</option>
                            </select>
                        </div>
                        <div class="option-item">
                            <select x-model="numImages">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button class="generate-btn" @click="generateImage" :disabled="!prompt || isGenerating">
                    <i class="fas" :class="isGenerating ? 'fa-spinner fa-spin' : 'fa-magic'"></i>
                    <span x-text="isGenerating ? 'Generating...' : 'Generate'"></span>
                </button>
            </div>
            
            <!-- Gallery Panel -->
            <div class="gallery-panel">
                <div class="gallery-header">
                    <span><i class="fas fa-images"></i> Gallery</span>
                    <button @click="clearGallery" style="background:none; border:none; color:var(--text-secondary);">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                
                <div class="gallery-content">
                    <div class="gallery-grid" x-show="images.length">
                        <template x-for="img in images" :key="img.id">
                            <div class="gallery-item" @click="openModal(img.url)">
                                <img :src="img.url" :alt="img.prompt">
                            </div>
                        </template>
                    </div>
                    
                    <div class="empty-gallery" x-show="!images.length">
                        <i class="fas fa-palette fa-2x"></i>
                        <p>No images yet</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal -->
        <div class="modal-overlay" :class="{ 'active': showModal }" @click.self="closeModal">
            <div class="modal-content">
                <img :src="selectedImage" alt="">
                <button class="modal-close" @click="closeModal">✕</button>
            </div>
        </div>
        
        <!-- Waiting -->
        <div class="waiting-overlay" x-show="isGenerating" x-cloak>
            <div class="waiting-spinner"></div>
        </div>
    </div>
    
    <script src="../js/image.js"></script>
    <script src="../js/notification.js"></script>
    
<!-- Global Settings Listener ကိုဖြုတ်ပြီး ဒီအစားထိုးပါ -->
<script>
window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'global-theme-change' && event.data.theme) {
        document.documentElement.setAttribute('data-theme', event.data.theme);
    }
});
</script>
</body>
</html>
