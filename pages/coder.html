<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Code Assistant - AmkyawDev AI</title>
    <link rel="stylesheet" href="../css/bulma.css">
    <link rel="stylesheet" href="../css/coder.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #2a2a35;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --accent: #19c37d;
            --accent-light: #6b9deb;
            --border: #2a2a35;
        }
        
        [data-theme="chatgpt"] {
            --bg-primary: #343541;
            --bg-secondary: #40414f;
            --bg-tertiary: #444654;
            --text-primary: #ececf1;
            --text-secondary: #c5c5d2;
            --accent: #19c37d;
            --border: #4d4d4f;
        }
        
        .coder-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        
        /* ===== MINIMAL STATUS LINE ===== */
        .status-line {
            height: 28px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 10px;
            color: var(--text-muted);
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-item i {
            font-size: 9px;
            color: var(--accent);
        }
        
        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        
        /* ===== EDITOR PANEL ===== */
        .editor-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-primary);
        }
        
        .editor-panel.full-width {
            width: 100%;
        }
        
        .editor-header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        
        .editor-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .editor-title i {
            color: var(--accent);
            font-size: 11px;
        }
        
        .language-selector {
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }
        
        .code-editor {
            flex: 1;
            overflow: hidden;
        }
        
        .code-editor textarea {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            border: none;
            padding: 16px;
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }
        
        .editor-footer {
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            background: var(--bg-secondary);
        }
        
        .editor-btn {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .editor-btn:hover {
            background: var(--accent);
            color: white;
        }
        
        .editor-btn.primary {
            background: var(--accent);
            color: white;
        }
        
        /* ===== OUTPUT PANEL ===== */
        .output-panel {
            width: 60%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        
        .output-panel.hidden {
            width: 0;
            display: none;
        }
        
        .output-header {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        
        .output-tabs {
            display: flex;
            gap: 2px;
        }
        
        .output-tab {
            padding: 4px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            border-radius: 12px;
        }
        
        .output-tab:hover {
            color: var(--text-primary);
        }
        
        .output-tab.active {
            background: var(--accent);
            color: white;
        }
        
        .output-actions {
            display: flex;
            gap: 2px;
        }
        
        .output-action {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
        }
        
        .output-action:hover {
            background: var(--accent);
            color: white;
        }
        
        .output-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        /* Markdown Output */
        .markdown-output {
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.6;
        }
        
        .markdown-output h1 { font-size: 20px; margin: 16px 0 8px; }
        .markdown-output h2 { font-size: 18px; margin: 14px 0 6px; }
        .markdown-output h3 { font-size: 16px; margin: 12px 0 4px; color: var(--accent); }
        .markdown-output pre {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
        }
        
        .console-output {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
        }
        
        /* Waiting Animation */
        .waiting-animation {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        
        .waiting-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(25, 195, 125, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Dialog */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
        }
        
        .dialog-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .dialog {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
        }
        
        .dialog-header {
            padding: 14px;
            border-bottom: 1px solid var(--border);
        }
        
        .dialog-body {
            padding: 14px;
        }
        
        .dialog-option {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        
        .dialog-option:hover {
            background: var(--accent);
        }
        
        /* Toggle Preview */
        .toggle-preview {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            z-index: 50;
        }
        
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .editor-panel, .output-panel { width: 100%; height: 50%; }
        }
    </style>
</head>
<body>
    <div class="coder-container" x-data="coderApp()" x-init="init()">
        <!-- Status Line (No Header) -->
        <div class="status-line">
            <div class="status-left">
                <div class="status-item">
                    <i class="fas fa-code"></i>
                    <span x-text="selectedLanguage">javascript</span>
                </div>
                <div class="status-item">
                    <i class="fas fa-circle"></i>
                    <span>Ready</span>
                </div>
            </div>
            <div class="status-right">
                <span class="cursor-position" x-text="cursorLine + ':' + cursorColumn">1:1</span>
            </div>
        </div>
        
        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Editor Panel -->
            <div class="editor-panel" :class="{ 'full-width': !showPreview }">
                <div class="editor-header">
                    <div class="editor-title">
                        <i class="fas fa-terminal"></i>
                        <span>Editor</span>
                    </div>
                    <select class="language-selector" x-model="selectedLanguage">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                    </select>
                </div>
                
                <div class="code-editor">
                    <textarea 
                        x-model="code"
                        @input="autoSave"
                        @keydown="updateCursorPosition"
                        x-ref="codeArea"
                    ></textarea>
                </div>
                
                <div class="editor-footer">
                    <button class="editor-btn" @click="runCode"><i class="fas fa-play"></i> Run</button>
                    <button class="editor-btn" @click="formatCode"><i class="fas fa-magic"></i> Format</button>
                    <button class="editor-btn" @click="openExplainDialog"><i class="fas fa-comment"></i> Explain</button>
                    <button class="editor-btn" @click="openDebugDialog"><i class="fas fa-bug"></i> Debug</button>
                </div>
            </div>
            
            <!-- Output Panel -->
            <div class="output-panel" :class="{ 'hidden': !showPreview }">
                <div class="output-header">
                    <div class="output-tabs">
                        <button class="output-tab" :class="{ 'active': activeTab === 'output' }" @click="activeTab = 'output'">Output</button>
                        <button class="output-tab" :class="{ 'active': activeTab === 'preview' }" @click="activeTab = 'preview'">Preview</button>
                        <button class="output-tab" :class="{ 'active': activeTab === 'explanation' }" @click="activeTab = 'explanation'">Explain</button>
                    </div>
                    <div class="output-actions">
                        <button class="output-action" @click="copyOutput"><i class="far fa-copy"></i></button>
                        <button class="output-action" @click="closePreview"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                
                <div class="output-content">
                    <div class="waiting-animation" x-show="isWaiting">
                        <div class="waiting-spinner"></div>
                        <div class="waiting-dots">...</div>
                    </div>
                    
                    <div x-show="activeTab === 'output' && !isWaiting">
                        <div class="console-output" x-html="output"></div>
                    </div>
                    <div x-show="activeTab === 'preview' && !isWaiting">
                        <div class="markdown-output" x-html="preview"></div>
                    </div>
                    <div x-show="activeTab === 'explanation' && !isWaiting">
                        <div class="markdown-output" x-html="explanation"></div>
                    </div>
                </div>
            </div>
            
            <button class="toggle-preview" @click="togglePreview">
                <i class="fas" :class="showPreview ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
        </div>
        
        <!-- Dialogs -->
        <div class="dialog-overlay" :class="{ 'active': activeDialog === 'explain' }" @click.self="closeDialog">
            <div class="dialog">
                <div class="dialog-header">Explain Code</div>
                <div class="dialog-body">
                    <div class="dialog-option" @click="explainCode('simple')">Simple</div>
                    <div class="dialog-option" @click="explainCode('detailed')">Detailed</div>
                    <div class="dialog-option" @click="explainCode('technical')">Technical</div>
                </div>
            </div>
        </div>
        
        <div class="dialog-overlay" :class="{ 'active': activeDialog === 'debug' }" @click.self="closeDialog">
            <div class="dialog">
                <div class="dialog-header">Debug Code</div>
                <div class="dialog-body">
                    <div class="dialog-option" @click="debugCode('quick')">Quick</div>
                    <div class="dialog-option" @click="debugCode('thorough')">Thorough</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function coderApp() {
            return {
                code: '// Write your code here\nconsole.log("Hello, World!");',
                selectedLanguage: 'javascript',
                showPreview: true,
                activeTab: 'output',
                output: '',
                preview: '',
                explanation: '',
                isWaiting: false,
                activeDialog: null,
                cursorLine: 1,
                cursorColumn: 1,
                
                init() {
                    this.loadCode();
                    this.setupEventListeners();
                },
                
                setupEventListeners() {
                    window.addEventListener('message', (event) => {
                        if (event.data && event.data.type === 'global-theme-change' && event.data.theme) {
                            document.documentElement.setAttribute('data-theme', event.data.theme);
                        }
                    });
                },
                
                runCode() {
                    this.isWaiting = true;
                    this.activeTab = 'output';
                    
                    setTimeout(() => {
                        if (this.selectedLanguage === 'javascript') {
                            try {
                                // Simple JavaScript evaluation (for demo only)
                                const originalLog = console.log;
                                let logs = [];
                                console.log = (...args) => {
                                    logs.push(args.join(' '));
                                };
                                
                                // Very simple eval - not for production!
                                eval(this.code);
                                
                                console.log = originalLog;
                                this.output = logs.join('<br>') || 'No output';
                            } catch (e) {
                                this.output = 'Error: ' + e.message;
                            }
                        } else {
                            this.output = `[${this.selectedLanguage} simulation]\nCode execution would run here.\n\nYour code:\n${this.code.substring(0, 100)}...`;
                        }
                        
                        this.isWaiting = false;
                    }, 1500);
                },
                
                formatCode() {
                    // Simple formatting (demo only)
                    this.code = this.code
                        .split('\n')
                        .map(line => line.trim())
                        .join('\n');
                },
                
                openExplainDialog() {
                    this.activeDialog = 'explain';
                },
                
                openDebugDialog() {
                    this.activeDialog = 'debug';
                },
                
                closeDialog() {
                    this.activeDialog = null;
                },
                
                explainCode(level) {
                    this.closeDialog();
                    this.isWaiting = true;
                    this.activeTab = 'explanation';
                    
                    setTimeout(() => {
                        this.explanation = `# Code Explanation (${level})\n\nThis code demonstrates a simple program. Here's what it does:\n\n1. Initializes variables\n2. Performs calculations\n3. Returns the result\n\n**Key points:**\n- Uses standard syntax\n- Implements core logic\n- Follows best practices`;
                        this.isWaiting = false;
                    }, 1000);
                },
                
                debugCode(mode) {
                    this.closeDialog();
                    this.isWaiting = true;
                    this.activeTab = 'output';
                    
                    setTimeout(() => {
                        this.output = `# Debug Results (${mode})\n\n**Potential issues found:**\n- None detected\n- Code appears valid\n- No syntax errors\n\n**Optimization suggestions:**\n- Consider adding error handling\n- Use more descriptive variable names`;
                        this.isWaiting = false;
                    }, 1000);
                },
                
                copyOutput() {
                    const text = this[this.activeTab === 'output' ? 'output' : this.activeTab === 'preview' ? 'preview' : 'explanation'];
                    navigator.clipboard.writeText(text.replace(/<[^>]*>/g, ''));
                    alert('Copied to clipboard');
                },
                
                closePreview() {
                    this.showPreview = false;
                },
                
                togglePreview() {
                    this.showPreview = !this.showPreview;
                },
                
                autoSave() {
                    localStorage.setItem('coderCode', this.code);
                    localStorage.setItem('coderLanguage', this.selectedLanguage);
                },
                
                loadCode() {
                    const savedCode = localStorage.getItem('coderCode');
                    const savedLang = localStorage.getItem('coderLanguage');
                    
                    if (savedCode) this.code = savedCode;
                    if (savedLang) this.selectedLanguage = savedLang;
                },
                
                updateCursorPosition(e) {
                    const textarea = e.target;
                    const pos = textarea.selectionStart;
                    const text = textarea.value.substring(0, pos);
                    this.cursorLine = (text.match(/\n/g) || []).length + 1;
                    
                    const lastNewLine = text.lastIndexOf('\n');
                    this.cursorColumn = lastNewLine === -1 ? pos + 1 : pos - lastNewLine;
                }
            };
        }
    </script>
</body>
</html>
