<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmkyawDev AI</title>
    <style>
        /* (မူလ CSS အတိုင်းထား) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #343541;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .loader {
            text-align: center;
            width: 100%;
            max-width: 380px;
            padding: 2rem;
        }
        
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            background: #19c37d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(25, 195, 125, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        
        h1 {
            color: #ececf1;
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        p {
            color: #c5c5d2;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        
        .progress {
            width: 200px;
            height: 4px;
            background: #40414f;
            border-radius: 4px;
            margin: 2rem auto;
            overflow: hidden;
        }
        
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #19c37d;
            border-radius: 4px;
            animation: load 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes load {
            0% { width: 0%; }
            20% { width: 30%; }
            50% { width: 65%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }
        
        .dots {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        
        .dots span {
            width: 6px;
            height: 6px;
            background: #19c37d;
            border-radius: 50%;
            opacity: 0.3;
            animation: dotPulse 1.4s infinite;
        }
        
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            </svg>
        </div>
        <h1>AmkyawDev AI</h1>
        <p>Loading your intelligent assistant</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    
    <script>
        // ===== LOGIN SOUND SYSTEM =====
        function playLoginSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // First note (C5)
                const osc1 = audioContext.createOscillator();
                const gain1 = audioContext.createGain();
                osc1.connect(gain1);
                gain1.connect(audioContext.destination);
                osc1.frequency.value = 523.25;
                osc1.type = 'sine';
                gain1.gain.setValueAtTime(0, audioContext.currentTime);
                gain1.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.05);
                gain1.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
                osc1.start(audioContext.currentTime);
                osc1.stop(audioContext.currentTime + 0.3);
                
                // Second note (E5) after delay
                setTimeout(() => {
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    osc2.frequency.value = 659.25;
                    osc2.type = 'sine';
                    gain2.gain.setValueAtTime(0, audioContext.currentTime);
                    gain2.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.05);
                    gain2.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
                    osc2.start(audioContext.currentTime);
                    osc2.stop(audioContext.currentTime + 0.3);
                }, 200);
                
            } catch (e) {
                console.log('Audio not supported');
            }
        }
        
        // Play sound when progress completes
        setTimeout(() => {
            playLoginSound();
            
            // Redirect to login after sound
            setTimeout(() => {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.3s ease';
                
                setTimeout(() => {
                    window.location.replace('auth/login.html');
                }, 300);
            }, 300);
            
        }, 1800);
    </script>
</body>
</html>
