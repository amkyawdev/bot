<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmkyawDev AI</title>
    <link rel="stylesheet" href="../css/bulma.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #343541;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        #three-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
        }
        
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: #40414f;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo svg {
            width: 56px;
            height: 56px;
            fill: #19c37d;
        }
        
        h2 {
            color: #ececf1;
            font-size: 1.6rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #c5c5d2;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: #19c37d;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .login-btn:hover {
            background: #15a06b;
            transform: translateY(-1px);
        }
        
        .login-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #8e8ea0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="three-bg"></div>
    
    <div class="login-card">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            </svg>
        </div>
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue</p>
        
        <button class="login-btn" onclick="handleLogin()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
            Continue with Google
        </button>
        
        <div class="footer">
            <p>Secure • Fast • AI-Powered</p>
        </div>
    </div>
    
    <script src="../js/three.index.js"></script>
    <script>
        function handleLogin() {
            localStorage.setItem('user', JSON.stringify({
                name: 'AmkyawDev User',
                email: 'user@example.com',
                avatar: '../assets/images/admin.png'
            }));
            window.location.href = '../pages/main.html';
        }
    </script>
</body>
</html>
